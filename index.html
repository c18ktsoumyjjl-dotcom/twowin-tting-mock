<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TWOWIN BET</title>
<style>
/* Pixel-locked to tting-2.com @ 1920×1072
   header 60 · sidebar 80 · main 1400@x300 · content 1336 pad32
   hero 1336×240 · cats 123×126 gap12 · cards 158×211 gap10 ×8
   TWOWIN mint/silver skin */
:root{
  --bg:#070e18; --panel:#0d1826; --panel2:#111f30; --side:#0a1420;
  --mint:#2EE8A8; --text:#e8eef4; --muted:#8a9aab; --line:#2EE8A833;
  --silver:linear-gradient(180deg,#f7f9fb 0%,#c5ced8 52%,#8e99a6 100%);
  --hh:60px; --sw:80px; --main-x:300px; --cw:1336px; --main-w:1400px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;min-width:1440px}
a{color:inherit;text-decoration:none}
header.desktop-header{
  width:1920px;max-width:100%;height:var(--hh);
  display:flex;align-items:center;gap:10px;padding:0 24px;
  background:#070e18;border-bottom:1px solid var(--line);
  position:fixed;inset:0 0 auto 0;z-index:30;
}
header .logo{height:32px;width:auto}
header .sp{flex:1}
.ib{width:36px;height:36px;border-radius:50%;background:var(--panel2);border:1px solid #2EE8A844;display:grid;place-items:center;color:var(--mint);font-size:14px}
.btn{border:0;border-radius:8px;height:40px;padding:0 22px;font-weight:700;font-size:14px;cursor:pointer;background:var(--silver);color:#0a1420}
.btn.ghost{background:transparent;border:1px solid #2EE8A855;color:var(--text)}
.btn.m{background:var(--mint);color:#062218}
/* collapsed icon sidebar — 80px, item 56×52, icon 24, x=12 */
aside.sidebar{
  position:fixed;top:var(--hh);left:0;bottom:0;width:var(--sw);
  background:var(--side);border-right:1px solid var(--line);
  overflow:auto;padding:12px 0;z-index:25;display:flex;flex-direction:column;align-items:center;gap:4px;
}
aside.sidebar .side-item{
  position:relative;width:56px;height:52px;margin:0 auto;
  border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--muted);font-size:9px;font-weight:700;gap:4px;cursor:pointer;
}
aside.sidebar .side-item .ic{
  width:24px;height:24px;border-radius:6px;background:var(--panel2);
  display:grid;place-items:center;color:var(--mint);font-size:11px;font-weight:900;overflow:hidden;
}
aside.sidebar .side-item:hover,aside.sidebar .side-item.on{background:#12384f;color:var(--mint)}
aside.sidebar .side-item.on{box-shadow:inset 3px 0 0 var(--mint)}
/* main-desktop: 1400 @ x=300; inner 1336 with 32 pad → content x=332 */
main.main-desktop{
  margin:var(--hh) 0 0 var(--main-x);
  width:var(--main-w);max-width:calc(100% - var(--main-x));
  padding:32px 32px 48px; /* 32 pad → content 1336 inside 1400 */
}
.hero-banner{
  width:1336px;max-width:100%;height:240px;border-radius:14px;overflow:hidden;
  border:1px solid var(--line);background:var(--panel);position:relative;
}
.hero-banner .slide{width:1334px;max-width:100%;height:238px;margin:1px auto 0;display:block;object-fit:cover}
.hero-banner .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.hero-banner .arrow{
  position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;
  border:0;background:#000a;color:#fff;cursor:pointer;font-size:18px;z-index:2;
}
.hero-banner .arrow.l{left:12px}.hero-banner .arrow.r{right:12px}
/* Category quick-nav: transparent silver chrome icon above KO/EN label (띵벳 style) */
.quick-nav-section{
  width:1336px;max-width:100%;margin:30px 0 30px;
  display:grid;grid-template-columns:repeat(7,1fr);gap:12px;
}
.main-card{
  position:relative;width:100%;height:148px;
  background:var(--panel);border:1px solid #2EE8A844;border-radius:12px;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 0 12px #2EE8A822;
}
.main-card img.tile{
  width:100%;height:104px;object-fit:contain;object-position:center;
  display:block;flex:0 0 104px;background:transparent;padding:6px 8px 0;box-sizing:border-box;
}
.main-card .lbl{
  flex:1;background:#2a2f38;display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:1px;padding:4px 6px;text-align:center;
}
.main-card .lbl b{color:#fff;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.main-card .lbl small{color:#9aa3ae;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.main-card:hover{border-color:var(--mint);box-shadow:0 0 14px #2EE8A866}
.section-head{
  width:1336px;max-width:100%;height:38px;display:flex;align-items:center;gap:10px;margin:0 0 16px;
}
.section-head h2{margin:0;font-size:22px;line-height:36px;height:36px;font-weight:800;display:flex;align-items:center;gap:10px}
.section-head .dot{width:10px;height:10px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint)}
.section-head .sp{flex:1}
.pill{height:28px;padding:0 12px;border-radius:14px;border:1px solid #2EE8A833;background:var(--panel2);color:#c7d5e0;font-size:12px;cursor:pointer}
.pill.on{background:var(--mint);color:#062218;border-color:transparent;font-weight:700}
section.game-section{width:1336px;max-width:100%;margin-bottom:28px}
.rail{display:grid;grid-template-columns:repeat(8,158px);justify-content:space-between;gap:10px;padding-bottom:4px;width:1336px;max-width:100%}
.pachinko-game-card-info{
  position:relative;flex:0 0 158px;width:158px;height:211px;
  border-radius:10px;overflow:hidden;border:1px solid #2EE8A855;background:var(--panel);
}
.pachinko-game-card-info{display:flex;flex-direction:column}
.pachinko-game-card-info img{width:158px;height:155px;object-fit:cover;object-position:top center;display:block;background:#0d1826;flex:0 0 155px}
.pachinko-game-card-info .lbl{flex:1;background:#2a2f38;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;padding:4px 6px;text-align:center}
.pachinko-game-card-info .lbl b{color:#fff;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pachinko-game-card-info .lbl small{color:#9aa3ae;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pachinko-game-card-info.empty{background:linear-gradient(180deg,#0d1826,#0a1420)}
.pachinko-game-card-info:hover{box-shadow:0 0 16px #2EE8A888}
footer{
  margin-left:var(--main-x);width:var(--main-w);max-width:calc(100% - var(--main-x));
  background:#070e18;border-top:1px solid var(--line);
  padding:22px 32px;color:var(--muted);font-size:12px;
  display:flex;flex-wrap:wrap;align-items:center;gap:18px;
}
footer .logo{height:26px}
footer nav{display:flex;flex-wrap:wrap;gap:14px;flex:1}
footer nav span{position:relative}
.x,.mv{display:none;position:absolute;top:4px;z-index:3;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer;font-weight:900;font-size:12px;padding:0;line-height:22px}
.x{right:4px;background:#e44;color:#fff}
.mv{background:#fff;color:#000}.mv.l{left:4px}.mv.r{left:28px}
.edit .x,.edit .mv{display:block}
.edit .sidebar .mv{display:none}
.edit .ed{outline:1px dashed var(--mint)}
#bar{position:fixed;right:16px;bottom:16px;display:flex;gap:8px;z-index:40}
</style>
</head>
<body>
<header class="desktop-header">
  <img class="logo" src="img/logo.png" alt="TWOWIN">
  <div class="sp"></div>
  <div class="ib">👤</div>
  <div class="ib">✈</div>
  <button class="btn ghost">로그인</button>
  <button class="btn m">회원가입</button>
</header>
<aside class="sidebar" id="side"></aside>
<main class="main-desktop">
  <div class="hero-banner">
    <img class="slide" src="img/banner.png" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
    <div class="ph" style="display:none">배너 · img/banner.png</div>
    <button class="arrow l" type="button">‹</button>
    <button class="arrow r" type="button">›</button>
  </div>
  <div class="quick-nav-section" id="cats"></div>
  <div id="rails"></div>
</main>
<footer>
  <img class="logo" src="img/logo.png" alt="">
  <nav id="fl"></nav>
  <span>저작권 © TWOWIN BET 모든 권리 보유.</span>
</footer>
<div id="bar">
  <button class="btn m" id="tg">편집모드</button>
  <button class="btn" id="ex">설정 내보내기</button>
  <button class="btn" id="rs">초기화</button>
</div>
<script src="config.js"></script>
<script>
const KEY='twowin-tting-v6';
let S=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(JSON.stringify(SITE));
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const $=id=>document.getElementById(id);
const n2=i=>String(i+1).padStart(2,'0');
const C=i=>`<button class="x" data-a="del" data-i="${i}">×</button><button class="mv l" data-a="up" data-i="${i}">◀</button><button class="mv r" data-a="dn" data-i="${i}">▶</button>`;
function bind(el,arr){
  el.querySelectorAll('[data-a]').forEach(b=>b.onclick=e=>{
    e.preventDefault();e.stopPropagation();
    const i=+b.dataset.i,a=b.dataset.a;
    if(a==='del'){if(!confirm('삭제할까요?'))return;arr.splice(i,1)}
    if(a==='up'&&i>0)[arr[i-1],arr[i]]=[arr[i],arr[i-1]];
    if(a==='dn'&&i<arr.length-1)[arr[i+1],arr[i]]=[arr[i],arr[i+1]];
    save();R();
  });
}
function R(){
  const sideMenus=S.sideMenus||S.menus||[];
  $('side').innerHTML=sideMenus.map((m,i)=>`<a href="#" class="side-item ed" title="${m}">${C(i)}<div class="ic">${m[0]}</div><span>${m.length>5?m.slice(0,4)+'…':m}</span></a>`).join('');
  bind($('side'),sideMenus);
  const EN=S.menuEn||['SPORTS','ESPORTS','SPORTSBOOK','POLYMARKET','CASINO','SLOTS','BET365'];
  $('cats').innerHTML=(S.menus||[]).map((c,i)=>{
    const ic=(S.menuIcons&&S.menuIcons[i])||n2(i);
    const en=EN[i]||'';
    return `<div class="main-card ed">${C(i)}<img class="tile" src="icons/cat-${ic}.png" alt="${c}" onerror="this.style.opacity=.3"><div class="lbl"><b contenteditable>${c}</b><small contenteditable>${en}</small></div></div>`;
  }).join('');
  bind($('cats'),S.menus);
  $('fl').innerHTML=(S.footerLinks||[]).map((f,i)=>`<span class="ed">${f}<button class="x" style="top:-14px;right:-10px" data-a="del" data-i="${i}">×</button></span>`).join('');
  bind($('fl'),S.footerLinks);
  const KO={evolution:'에볼루션',pragmatic:'프라그마틱',blackjack:'블랙잭',baccarat:'바카라',roulette:'룰렛',wheel:'휠',microgaming:'마이크로게이밍',playtech:'플레이텍',dreamgaming:'드림게이밍',sexy:'섹시게이밍',ezugi:'이주기',skywind:'스카이윈드',betradar:'벳레이더',hacksaw:'핵쏘',pgsoft:'PG소프트',habanero:'하바네로',netent:'넷엔트',cq9:'CQ9',booongo:'부운고',redtiger:'레드타이거',relax:'릴렉스'};
  $('rails').innerHTML=(S.rails||[]).map((r,ri)=>`<section class="game-section ed">
    <div class="section-head">
      <h2><span class="dot"></span>${r.title}</h2>
      <span class="sp"></span>
      <button class="pill on">인기</button><button class="pill">추천</button><button class="pill">모두</button>
      <button class="x" style="position:static" data-s="${ri}">×</button>
      <button class="mv" style="position:static;border-radius:8px;width:auto;padding:0 8px" data-su="${ri}">▲</button>
    </div>
    <div class="rail" data-ri="${ri}">${(r.items&&r.items.length?r.items:Array(8).fill(null)).slice(0,8).map((f,i)=>f
      ?`<div class="pachinko-game-card-info ed">${C(i)}<img src="${r.dir}/${f}" alt="${f}" title="${r.dir}/${f}" onerror="this.parentElement.classList.add('empty');this.remove()"><div class="lbl"><b contenteditable>${KO[f.replace(/\.\w+$/,'').toLowerCase()]||f.replace(/\.\w+$/,'')}</b><small contenteditable>${f.replace(/\.\w+$/,'').replace(/[-_]/g,' ').toUpperCase()}</small></div></div>`
      :`<div class="pachinko-game-card-info empty ed">${C(i)}</div>`
    ).join('')}</div>
  </section>`).join('');
  document.querySelectorAll('.rail').forEach(el=>{
    const ri=+el.dataset.ri;
    if(!S.rails[ri].items) S.rails[ri].items=[];
    bind(el,S.rails[ri].items);
  });
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{if(confirm('섹션 전체 삭제?')){S.rails.splice(+b.dataset.s,1);save();R()}});
  document.querySelectorAll('[data-su]').forEach(b=>b.onclick=()=>{const i=+b.dataset.su;if(i>0){[S.rails[i-1],S.rails[i]]=[S.rails[i],S.rails[i-1]];save();R()}});
}
R();
$('tg').onclick=()=>{document.body.classList.toggle('edit');$('tg').textContent=document.body.classList.contains('edit')?'편집 끝':'편집모드'};
$('rs').onclick=()=>{if(confirm('config.js 원래대로?')){localStorage.removeItem(KEY);S=JSON.parse(JSON.stringify(SITE));R()}};
$('ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['window.SITE = '+JSON.stringify(S,null,2)+';\n'],{type:'text/javascript'}));a.download='config.js';a.click()};
</script>
</body>
</html>
